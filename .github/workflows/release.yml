name: Release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package source and SBOM
        run: |
          git archive --format=tar.gz -o "${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.tar.gz" HEAD
      - uses: anchore/sbom-action@v0
        with: { format: spdx-json, output-file: sbom.spdx.json }
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "*.tar.gz" }
      - name: Create release with generated notes
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" *.tar.gz sbom.spdx.json --generate-notes --verify-tag
