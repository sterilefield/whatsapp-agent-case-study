name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and release, e.g. v0.1.0"
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Validate version
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Package source and SBOM
        run: git archive --format=tar.gz -o "${GITHUB_REPOSITORY#*/}-${TAG}.tar.gz" HEAD
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { format: spdx-json, output-file: sbom.spdx.json }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with: { subject-path: "*.tar.gz" }
      - name: Create release with generated notes
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" *.tar.gz sbom.spdx.json --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          else
            gh release create "$TAG" *.tar.gz sbom.spdx.json --generate-notes --verify-tag
          fi
