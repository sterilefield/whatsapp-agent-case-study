# Thin wrapper: all logic lives in scripts/check.sh so the same checks run anywhere (no vendor lock-in).
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: bash scripts/check.sh
