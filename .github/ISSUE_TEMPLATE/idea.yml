name: Idea or improvement
description: Suggest a change, an example or a doc improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: "What problem does this solve?", description: "Who needs it and why" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: "Proposal", description: "What you would like to see" }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Docs, Example, Tooling, Governance, Other]
