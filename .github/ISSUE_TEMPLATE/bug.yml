name: Bug report
description: Something in this repository is wrong or broken
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please never paste secrets, customer data or personal data here.
  - type: textarea
    id: what
    attributes: { label: "What happened?", description: "What you saw and what you expected instead" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: "Steps to reproduce", placeholder: "1. …\n2. …\n3. …" }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: "Version or commit", placeholder: "v0.1.0 or a short SHA" }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no secrets, customer data or personal data
          required: true
